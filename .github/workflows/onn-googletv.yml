name: OpenCE Onn GoogleTV (armeabi-v7a)

# The 32-bit Android app (armeabi-v7a, docs/onn_googletv_android.md) of
# this fork, for Android TV boxes whose Android runs only 32-bit apps.
#
# build: on each push to armeabi-v7a (and by hand), the release app,
# compiled with the clang whose profiles pgo/ holds (PROFILE_LLVM_MAJOR in
# tools/linux_build.py), so that they optimise it, and the debug app
# (assertions checked, for finding problems). The build job runs the
# repository's code (the main project's, merged by the sync) with no secret:
# Gradle signs the apps with its debug key. The sign job, which runs none of
# the repository's code, signs them again with the app's key (the
# OPENCE_ONN_GOOGLETV_KEYSTORE_BASE64 and OPENCE_ONN_GOOGLETV_KEYSTORE_PASSWORD
# secrets; names of this fork's own, so that no workflow of the main
# project's that comes with a merge finds them), checks that the key is the
# one the installed apps have, and publishes them as a release build-<n>
# holding opence-onn-googletv-release.zip
# and opence-onn-googletv-debug.zip, the newest marked latest: the app's self-updater
# (Updater.java) of the builds made here takes the one of its own kind from
# this repository. The players' version follows the main project's releases
# (tools/onn_googletv_version.sh): base, then <base>.<n>, base the number of the
# main project's newest release (its build-<base>) whose commit the build
# contains: the main project's release itself is just the base (365), and
# this fork's own releases after it on that base are 365.1, 365.2:
# the app's version name and the release's title, which the README's
# download badge shows (HALO_VERSION_NAME). n is
# base * 100 + revision: the app's version code and the number the updater
# compares, above the builds 101-127 of the workflow's old name
# (androidtv.yml), whose installs then update to these. The last five
# releases are kept.
#
# sync: every six hours (and by hand, with the sync input), the main project's
# newest release (its newest build-<n> tag: a build of its main that passed
# on every platform) is merged into armeabi-v7a when this branch does not
# have it yet, so that this app stays able to play with the main project's
# (machines of different network versions do not play together:
# port/linux/include/halo_port_limits.h), and then built: its version is then
# exactly <n>, the main project's (tools/onn_googletv_version.sh). Its commits
# after its last release wait for its next one. A merge
# that conflicts is not pushed: the run fails with an error saying so (and
# opens an issue, where the repository has issues). GitHub's own token cannot
# push a merge that changes .github/workflows; the OPENCE_ONN_GOOGLETV_SYNC_TOKEN
# secret, a token with contents and workflows write access to this
# repository, can, and its pushes start the build themselves. A token that no
# longer works (expired) is reported in an issue, and the sync goes on with
# GitHub's own token.
#
# The sync also builds again a commit of armeabi-v7a that has no release
# (twice for a passing failure; after three failures an issue, and once a
# day), disables any other workflow that a merge of the main project's made
# active here, and writes docs/onn_googletv_keepalive.md
# after 45 days without a commit (GitHub turns schedules off after 60). By
# hand, the rebuild input rolls back: an earlier release's commit, built as a
# new release with the next number, which the boxes take as an update.
# docs/onn_googletv_runbook.md says what to do when the workflow asks.
#
# The main project's own workflows (build.yml: every platform, its releases
# and its web site; server-image.yml) are for it: they stay in the branch, so
# that merging the main project's changes to them does not conflict, but are
# disabled here (Actions, the workflow, Disable workflow). This workflow runs
# only for armeabi-v7a, the fork's only long-lived branch.
on:
  push:
    branches: [armeabi-v7a]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      sync:
        description: "Merge the main project's newest release first (then build)"
        type: boolean
        default: false
      rebuild:
        description: "Roll back: rebuild this earlier release (its tag, build-<n>) or commit of armeabi-v7a as a new release"
        type: string
        default: ""
  schedule:
    # (every six hours, off the hour, which GitHub delays the most)
    - cron: "17 */6 * * *"

concurrency:
  group: onn-googletv-${{ github.event_name == 'schedule' && 'sync' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/OpenCommunityEdition/OpenCE.git
  UPSTREAM_BRANCH: main
  BRANCH: armeabi-v7a

jobs:
  sync:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # the sync token, if it still works: an expired one would stop every
      # sync at the checkout, so it is reported (an issue) and left aside
      - name: Sync token
        id: token
        env:
          SYNC_TOKEN: ${{ secrets.OPENCE_ONN_GOOGLETV_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "no OPENCE_ONN_GOOGLETV_SYNC_TOKEN: GitHub's own token (it cannot push merges that change workflows)"
            echo "works=false" >> "$GITHUB_OUTPUT"
          elif GH_TOKEN="$SYNC_TOKEN" gh api "repos/$GH_REPO" --jq .full_name > /dev/null 2>&1; then
            echo "works=true" >> "$GITHUB_OUTPUT"
            # (GitHub names a token's expiry in its responses: two weeks
            # before it, an issue says to renew it)
            expires="$(curl -sS -o /dev/null -D - -H "Authorization: Bearer $SYNC_TOKEN" "https://api.github.com/repos/$GH_REPO" |
              sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration: *\(.*[^[:space:]]\).*$/\1/p')"
            if [ -n "$expires" ] && expiry="$(date -d "$expires" +%s 2>/dev/null)" &&
              [ $(( expiry - $(date +%s) )) -lt $(( 14 * 86400 )) ]; then
              title="The sync token expires soon"
              echo "::warning title=$title::OPENCE_ONN_GOOGLETV_SYNC_TOKEN expires on $expires"
              if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" = "true" ] &&
                [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
                printf 'The OPENCE_ONN_GOOGLETV_SYNC_TOKEN secret expires on %s.\n\nRegenerate the token before then (Settings, Developer settings, Fine-grained tokens, the token, Regenerate token, a new expiry) and put its new value in the secret (this repository'"'"'s Settings, Secrets and variables, Actions). Then close this issue. See docs/onn_googletv_runbook.md.\n' \
                  "$expires" > issue.md
                gh issue create --title "$title" --body-file issue.md || true
              fi
            fi
          else
            echo "works=false" >> "$GITHUB_OUTPUT"
            title="The sync token no longer works"
            echo "::warning title=$title::OPENCE_ONN_GOOGLETV_SYNC_TOKEN was refused (expired?): renew it; the sync uses GitHub's own token meanwhile"
            if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" = "true" ] &&
              [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              printf 'GitHub refused the OPENCE_ONN_GOOGLETV_SYNC_TOKEN secret (it has probably expired).\n\nMake a new fine-grained token (Settings, Developer settings, Fine-grained tokens) for this repository with Contents and Workflows read and write access, and put it in the secret (this repository'"'"'s Settings, Secrets and variables, Actions). Until then the sync merges with GitHub'"'"'s own token, which cannot push a merge that changes the main project'"'"'s workflows.\n\nRun: %s\n' \
                "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" > issue.md
              gh issue create --title "$title" --body-file issue.md || true
            fi
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.works == 'true' && secrets.OPENCE_ONN_GOOGLETV_SYNC_TOKEN || github.token }}

      - name: Merge the main project's newest release
        id: merge
        run: |
          # a problem: the run's error (GitHub mails a failed scheduled run),
          # and an issue where the repository has issues (forks start without)
          report() {
            echo "::error title=$1::$(head -n 1 "$2")"
            if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ] &&
              [ -z "$(gh issue list --state open --search "\"$1\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$1" --body-file "$2" || true
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          # the main project's newest release: its highest build-<n> tag
          release="$(git ls-remote --tags upstream 'build-*' | sed -n 's|.*refs/tags/\(build-[0-9]*\)$|\1|p' |
            sort -t- -k2 -n | tail -n 1)"
          if [ -z "$release" ]; then
            echo "::error::no build-<n> tag in $UPSTREAM"
            exit 1
          fi
          git fetch --no-tags upstream "refs/tags/$release:refs/remotes/upstream/release"
          if git merge-base --is-ancestor upstream/release HEAD; then
            echo "already has the main project's newest release, $release"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(git rev-list --count HEAD..upstream/release)"
          if ! git merge --no-edit -m "Merge the main project's $release ($count new commits)" upstream/release; then
            git merge --abort
            printf 'The sync could not merge the main project'"'"'s %s (%s new commits of %s) into %s: they conflict with this fork'"'"'s changes.\n\nMerge them by hand (git fetch %s refs/tags/%s, git merge FETCH_HEAD, resolve, push).\n\nRun: %s\n' \
              "$release" "$count" "$UPSTREAM" "$BRANCH" "$UPSTREAM" "$release" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > issue.md
            report "Merging the main project's $release conflicts" issue.md
            exit 1
          fi
          if ! git push origin "HEAD:$BRANCH" 2> push.log; then
            cat push.log
            if grep -q "workflow" push.log; then
              printf 'The main project changed its workflows (.github/workflows), which GitHub'"'"'s own token cannot push.\n\nAdd an OPENCE_ONN_GOOGLETV_SYNC_TOKEN secret (a fine-grained token with Contents and Workflows read and write access to this repository), or merge %s %s into %s by hand.\n\nRun: %s\n' \
                "$UPSTREAM" "$release" "$BRANCH" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > issue.md
              report "The sync cannot push the main project's changes" issue.md
            fi
            exit 1
          fi
          echo "merged $release ($count commits)"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # (a push with GitHub's own token starts no workflow; one with the sync
      # token starts the build itself, unless the merge changed only .md
      # files, which pushes do not build)
      - name: Build the merge
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          PUSHED_WITH_SYNC_TOKEN: ${{ steps.token.outputs.works }}
        run: |
          if [ "$PUSHED_WITH_SYNC_TOKEN" != "true" ] || ! git diff --name-only HEAD^1 HEAD | grep -qv '\.md$'; then
            gh workflow run onn-googletv.yml --ref "$BRANCH"
          fi

      # a workflow of the main project's that came with a merge (a new one, or
      # one it renamed) is active here until it is disabled: only this
      # workflow runs in the fork, so any other is disabled, and its runs
      # stopped
      - name: Disable the main project's workflows
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          # (GitHub takes a moment to list a workflow that was just pushed)
          if [ "$MERGED" = "true" ]; then
            sleep 30
          fi
          gh api "repos/$GH_REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active" and (.path | startswith(".github/workflows/")) and .path != ".github/workflows/onn-googletv.yml") | "\(.id) \(.path)"' > others.txt || true
          while read -r id path; do
            if gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/disable" < /dev/null; then
              echo "::warning title=Disabled a workflow of the main project's::$path was active in this repository: disabled"
            else
              echo "::warning title=A workflow of the main project's is active::$path could not be disabled: disable it in the Actions settings"
            fi
            for run in $(gh api "repos/$GH_REPO/actions/workflows/$id/runs?per_page=50" --jq '.workflow_runs[] | select(.status != "completed") | .id' < /dev/null || true); do
              gh api -X POST "repos/$GH_REPO/actions/runs/$run/cancel" > /dev/null < /dev/null || true
            done
          done < others.txt

      # a commit of armeabi-v7a that has no release, whose build failed: built
      # again, twice for a passing reason (a download, the runner). After
      # three failures an issue says so (nobody is mailed for a build the
      # sync started), and the commit is built again once a day, so that a
      # long outage of a download still ends in a release; the issue is
      # closed when it does. Commits of .md files only are not built, and a
      # commit with a release (a rollback's base too) is left alone
      - name: Build again what has no release
        if: ${{ steps.merge.outputs.merged != 'true' }}
        run: |
          title="The build of $BRANCH keeps failing"
          issues() {
            if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" = "true" ]; then
              gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number'
            fi
          }
          built() {
            for issue in $(issues || true); do
              gh issue close "$issue" --comment "$1" || true
            done
          }
          sha="$(git rev-parse HEAD)"
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].target_commitish' > released.txt
          if grep -qx "$sha" released.txt; then
            echo "$sha has a release"
            built "The newest commit of $BRANCH, $sha, has a release."
            exit 0
          fi
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .target_commitish 2>/dev/null || true)"
          if [ -n "$latest" ] && git merge-base --is-ancestor "$latest" HEAD 2>/dev/null &&
            ! git diff --name-only "$latest" HEAD | grep -qv '\.md$'; then
            echo "only .md files changed since the latest release: nothing to build"
            built "The newest code of $BRANCH, $latest, has a release."
            exit 0
          fi
          # the runs of this commit that built (the syncs' own, this one too,
          # skip the build) and did not succeed, whatever stopped them (a
          # failure, the time limit)
          gh api "repos/$GH_REPO/actions/workflows/onn-googletv.yml/runs?head_sha=$sha&branch=$BRANCH&per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion) \(.updated_at) \(.html_url)"' > runs.txt
          failed=0
          last=0
          last_url=""
          while read -r run status conclusion updated url; do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            if [ "$status" != "completed" ]; then
              echo "a run of $sha is $status"
              exit 0
            fi
            if [ "$(gh api "repos/$GH_REPO/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion != "skipped")] | length' < /dev/null)" = "0" ]; then
              continue
            fi
            [ "$conclusion" = "success" ] && continue
            failed=$(( failed + 1 ))
            ended="$(date -d "$updated" +%s)"
            if [ "$ended" -gt "$last" ]; then
              last=$ended
              last_url=$url
            fi
          done < runs.txt
          if [ "$failed" -ge 3 ]; then
            echo "::warning title=$title::$sha failed to build $failed times (docs/onn_googletv_runbook.md)"
            if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" = "true" ] && [ -z "$(issues)" ]; then
              printf 'The newest commit of %s, %s, has no release: its build failed %s times, so the failure is probably not a passing one (a download, the runner). The boxes stay on the last release.\n\nThe sync goes on building it once a day, and closes this issue when a release appears. If the failure is in the code (the main project'"'"'s release does not build in this fork as it is), it needs a person: see "A build failed" in docs/onn_googletv_runbook.md.\n\nThe last failed run: %s\n' \
                "$BRANCH" "$sha" "$failed" "$last_url" > issue.md
              gh issue create --title "$title" --body-file issue.md || true
            fi
            if [ $(( $(date +%s) - last )) -lt 86400 ]; then
              echo "built again once a day: the last try ended $(( ($(date +%s) - last) / 3600 )) hours ago"
              exit 0
            fi
          fi
          echo "$sha has no release ($failed failed builds): building it again"
          gh workflow run onn-googletv.yml --ref "$BRANCH"

      # GitHub turns a public repository's schedules off after 60 days with no
      # commit: when the main project has released nothing for 45, a commit
      # of the keepalive note (an .md file, which builds nothing) keeps the
      # sync running
      - name: Keep the schedule alive
        if: ${{ steps.merge.outputs.merged != 'true' }}
        run: |
          last="$(git log -1 --format=%ct HEAD)"
          if [ $(( $(date +%s) - last )) -lt $(( 45 * 86400 )) ]; then
            exit 0
          fi
          printf '# Sync keepalive\n\nWritten by the sync (.github/workflows/onn-googletv.yml) when armeabi-v7a had no commit for 45 days, so that GitHub does not turn the scheduled sync off (it does after 60). Last written: %s.\n' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" > docs/onn_googletv_keepalive.md
          git add docs/onn_googletv_keepalive.md
          git commit -q -m "Keep the scheduled sync alive (no commit for 45 days)"
          git push origin "HEAD:$BRANCH"

  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.sync) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # (no secret here: this job runs the repository's code)
    permissions:
      contents: read
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
      network_version: ${{ steps.version.outputs.network_version }}
      subject: ${{ steps.version.outputs.subject }}
      commit: ${{ steps.version.outputs.commit }}
      based_on: ${{ steps.version.outputs.based_on }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REBUILD: ${{ inputs.rebuild }}
    steps:
      # (a rollback: the earlier release's commit, with this workflow)
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.rebuild || github.sha }}

      - name: Rollback
        if: ${{ inputs.rebuild != '' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$BRANCH" ]; then
            echo "::error::a rollback is run on $BRANCH (Run workflow, Use workflow from: $BRANCH)"
            exit 1
          fi
          git fetch -q --no-tags --depth=500 origin "$BRANCH"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$REBUILD is not a commit of $BRANCH"
            exit 1
          fi
          # (an app before 359.1 has an updater that asks for the archives'
          # earlier names: the boxes would stop updating)
          if ! grep -q HALO_RELEASE_ASSET_PREFIX port/android/app/src/main/java/com/halo/decomp/Updater.java; then
            echo "::error::$REBUILD is from before 359.1, whose apps no longer find this repository's updates"
            exit 1
          fi
          echo "rolling back to $REBUILD ($(git rev-parse --short HEAD))"

      # ninja, ccache, and the clang of the main project's profiles in pgo/
      # (PROFILE_LLVM_MAJOR, tools/linux_build.py: read, not run), from
      # LLVM's own packages, which the guest is compiled and optimised with
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL --retry 5 --retry-all-errors -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL --retry 5 --retry-all-errors -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          major="$(sed -n 's/^PROFILE_LLVM_MAJOR = \([0-9][0-9]*\).*/\1/p' tools/linux_build.py)"
          if [ -z "$major" ]; then
            major=22
            echo "::warning::no PROFILE_LLVM_MAJOR in tools/linux_build.py: clang $major"
          fi
          # (three tries: LLVM's packages are now and then unreachable)
          installed=false
          for attempt in 1 2 3; do
            if curl -fsSL --retry 5 --retry-all-errors -o llvm.sh https://apt.llvm.org/llvm.sh &&
              sudo bash llvm.sh "$major" && clang-"$major" --version &&
              "$(clang-"$major" -print-prog-name=ld.lld)" --version; then
              installed=true
              break
            fi
            sleep 60
          done
          mkdir -p "$RUNNER_TEMP/clang"
          if [ "$installed" = true ]; then
            echo "CI_ANDROID_GUEST_CC=clang-$major" >> "$GITHUB_ENV"
            # (the guest optimised as one module, linked by its clang's ld.lld)
            echo "CI_ANDROID_GUEST_LTO=1" >> "$GITHUB_ENV"
            ln -sf "$(command -v clang-"$major")" "$RUNNER_TEMP/clang/clang"
            ln -sf "$(clang-"$major" -print-prog-name=ld.lld)" "$RUNNER_TEMP/clang/ld.lld"
          else
            # the runner's own clang: slower code (no profiles, no link-time
            # optimisation), but a release all the same
            echo "::warning::clang $major could not be installed from apt.llvm.org: the runner's $(clang --version | head -n 1), without the profiles or link-time optimisation"
            echo "CI_ANDROID_GUEST_CC=clang" >> "$GITHUB_ENV"
            echo "CI_ANDROID_GUEST_LTO=" >> "$GITHUB_ENV"
          fi

      # the version (tools/onn_googletv_version.sh): this commit's recent
      # history and the main project's, to find its newest release in it
      - name: Version
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git fetch -q --no-tags --depth=500 origin "$GITHUB_SHA" "$(git rev-parse HEAD)"
          git fetch -q --no-tags --depth=500 "$UPSTREAM" "$UPSTREAM_BRANCH"
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/tags.txt"
          # (the script of this workflow's commit: a rollback's commit may
          # have an older one, or none)
          git show "$GITHUB_SHA:tools/onn_googletv_version.sh" > "$RUNNER_TEMP/version.sh"
          # (a failure of the script stops the build: no release with no number)
          version="$(bash "$RUNNER_TEMP/version.sh" "$UPSTREAM" "$RUNNER_TEMP/tags.txt")"
          read -r code name based_on <<< "$version"
          echo "version $name (build-$code), based on OpenCE build $based_on"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "based_on=$based_on" >> "$GITHUB_OUTPUT"
          if [ -n "$REBUILD" ]; then
            MESSAGE="Rollback: a rebuild of $REBUILD ($(git rev-parse --short HEAD))"
          fi
          echo "HALO_BUILD_NUMBER=$code" >> "$GITHUB_ENV"
          echo "HALO_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "network_version=$(sed -n 's/^#define HALO_PORT_NETWORK_VERSION \([0-9]*\).*/\1/p' port/linux/include/halo_port_limits.h)" >> "$GITHUB_OUTPUT"
          echo "subject=$(printf '%s' "${MESSAGE:-$(git log -1 --format=%s)}" | head -n 1)" >> "$GITHUB_OUTPUT"
          # (the release's archives' name, which the updater downloads)
          echo "HALO_RELEASE_ASSET_PREFIX=opence-onn-googletv" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-onn-googletv-${{ github.sha }}
          restore-keys: ccache-onn-googletv-

      - uses: actions/cache@v5
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # (signed with Gradle's debug key: the sign job signs them again)
      - name: Release build
        env:
          CI_ANDROID_ABIS: armeabi-v7a
          CI_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          # (the build's own failure, not tee's success)
          set -o pipefail
          python3 tools/ci_build.py android release 2>&1 | tee build.log
          # (the guest's compiler only: configure.py also writes the Linux
          # build's rules, with the runner's own clang)
          if grep -q "^$CI_ANDROID_GUEST_CC is clang .*building without profile-guided optimisation" build.log; then
            echo "::warning::the guest was built without the profiles in pgo/"
          fi

      # (without the profiles and link-time optimisation, as the main
      # project's debug builds: tools/ci_build.py)
      - name: Debug build
        env:
          CI_ANDROID_ABIS: armeabi-v7a
          CI_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: python3 tools/ci_build.py android debug

      - name: Check the apps
        run: |
          for apk in dist/halo-android-release/app-release.apk dist/halo-android-debug/app-debug.apk; do
            unzip -l "$apk" | grep -q "lib/armeabi-v7a/libmain.so"
            unzip -l "$apk" | grep -q "assets/halo_guest_armv7.elf"
            unzip -l "$apk" | grep -q "assets/halo_guest_armv8.elf"
            ! unzip -l "$apk" | grep -q "lib/arm64-v8a/"
          done

      # the fork's own 32-bit code that a PC can run: the fixups of the
      # guest's unaligned accesses (tools/test_host_alignment.py)
      - name: 32-bit tests
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest
          if [ ! -f tools/test_host_alignment.py ]; then
            echo "no tools/test_host_alignment.py in this commit"
            exit 0
          fi
          PATH="$RUNNER_TEMP/clang:$PATH" "$RUNNER_TEMP/venv/bin/python" -m pytest -q -rs -p no:cacheprovider \
            tools/test_host_alignment.py 2>&1 | tee tests.log
          if grep -q "skipped" tests.log; then
            echo "::warning::the 32-bit tests were skipped (tests.log)"
          fi

      # (for the sign job only)
      - uses: actions/upload-artifact@v6
        with:
          name: unsigned
          path: dist
          retention-days: 1

  # The apps signed with the app's key, and published. This job runs none of
  # the repository's code (no checkout): the key is only here.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # the certificate of the key the installed apps are signed with: an app
      # signed with any other does not install over them (and uninstalling
      # first deletes the game data), so another is refused here
      KEY_CERTIFICATE_SHA256: dc9787ca36279161fbcfdb2a5042afbc7427a37945b4ef0657554b9a222fec58
      KEY_ALIAS: halo
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: unsigned
          path: dist

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.OPENCE_ONN_GOOGLETV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPENCE_ONN_GOOGLETV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::no OPENCE_ONN_GOOGLETV_KEYSTORE_BASE64 or OPENCE_ONN_GOOGLETV_KEYSTORE_PASSWORD secret: the apps cannot be signed with the app's key"
            exit 1
          fi
          # (the secret's text, line breaks and all: Windows's CRLF taken out)
          if ! printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/key.keystore"; then
            echo "::error::OPENCE_ONN_GOOGLETV_KEYSTORE_BASE64 is not base64 text"
            exit 1
          fi
          echo "key: $(wc -c < "$RUNNER_TEMP/key.keystore") bytes"
          echo "build tools: $(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n 1)"
          # signs every APK under dist/ with the key, in place: the build signed it
          # with Gradle's debug key, which is taken out first
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          for apk in dist/*/*.apk; do
            zip -q -d "$apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' > /dev/null 2>&1 || true
            echo "$apk: aligning"
            "$tools/zipalign" -f -P 16 4 "$apk" "$apk.aligned"
            echo "$apk: signing"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/key.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --v2-signing-enabled true --out "$apk" "$apk.aligned"
            rm -f "$apk.aligned" "$apk.idsig"
            # (signed by this key alone, the one the installed apps have; the
            # verifier's own words when it refuses the APK)
            echo "$apk: verifying"
            if ! verified="$("$tools/apksigner" verify --print-certs "$apk" 2>&1)"; then
              echo "::error::$apk does not verify after signing"
              printf '%s\n' "$verified"
              exit 1
            fi
            # (every certificate the verifier names, however a version of
            # the build tools words its lines: "Signer #1 certificate SHA-256
            # digest:", "V3.0 Signer: certificate SHA-256 digest:")
            certificates="$(printf '%s\n' "$verified" | sed -n 's/.*certificate SHA-256 digest: *\([0-9a-f]*\).*/\1/p' | sort -u)"
            if [ "$certificates" != "$KEY_CERTIFICATE_SHA256" ]; then
              echo "::error::$apk is signed by ${certificates:-no certificate the verifier names}, not the app's key $KEY_CERTIFICATE_SHA256: a different key in the secret? Its apps would not install over the installed ones"
              printf '%s\n' "$verified"
              exit 1
            fi
            certificate="$certificates"
            if ! "$tools/zipalign" -c -P 16 4 "$apk" > /dev/null; then
              echo "::error::$apk is not aligned after signing"
              exit 1
            fi
            echo "$apk: signed, $certificate"
          done
          rm -f "$RUNNER_TEMP/key.keystore"

      - uses: actions/upload-artifact@v6
        with:
          name: halo-android-release
          path: dist/halo-android-release
          retention-days: 7

      - uses: actions/upload-artifact@v6
        with:
          name: halo-android-debug
          path: dist/halo-android-debug
          retention-days: 7

      # the release the self-updater looks for: tag build-<n>, the latest,
      # with opence-onn-googletv-release.zip and -debug.zip (each app and its
      # licences). (The apps of builds 127 and before ask for the archives'
      # earlier names, halo-android-release.zip: they no longer update, and
      # are updated by hand once, adb install -r)
      - name: Publish
        if: ${{ github.ref == 'refs/heads/armeabi-v7a' }}
        env:
          CODE: ${{ needs.build.outputs.code }}
          NAME: ${{ needs.build.outputs.name }}
          NETWORK_VERSION: ${{ needs.build.outputs.network_version }}
          SUBJECT: ${{ needs.build.outputs.subject }}
          COMMIT: ${{ needs.build.outputs.commit }}
          BASED_ON: ${{ needs.build.outputs.based_on }}
          PREFIX: opence-onn-googletv
        run: |
          tag="build-$CODE"
          (cd dist/halo-android-release && zip -qr "$GITHUB_WORKSPACE/$PREFIX-release.zip" .)
          (cd dist/halo-android-debug && zip -qr "$GITHUB_WORKSPACE/$PREFIX-debug.zip" .)
          printf '%s\n\nOpenCE Onn GoogleTV '"$NAME"': the 32-bit Android app (armeabi-v7a) for the Onn 4K GoogleTV boxes. Install opence-onn-googletv-release.zip'"'"'s APK (adb install -r), or let the app update itself; opence-onn-googletv-debug.zip'"'"'s app checks the game'"'"'s assertions, for reporting problems.\n\nBased on OpenCE build '"$BASED_ON"'.\nCommit: %s\nBuild: %s\nNetwork version: %s\n' \
            "$SUBJECT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$NETWORK_VERSION" > notes.md
          gh release create "$tag" "$PREFIX-release.zip" "$PREFIX-debug.zip" --target "$COMMIT" --latest \
            --title "$NAME" --notes-file notes.md

      - name: Keep the last five
        if: ${{ github.ref == 'refs/heads/armeabi-v7a' }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done
